name: End-to-end tests

on:
  push:
    branches: [main, portfolio-cleanup]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nf-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow: ["24.10.5", "25.10.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}
      - name: Install nf-test
        run: curl -fsSL https://code.askimed.com/install/nf-test | bash
      - name: Run pipeline regression tests
        run: ./nf-test test tests/default.nf.test --ci --profile docker
